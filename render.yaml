# Render Blueprint for Agula Terminal.
# Render dashboard -> New -> Blueprint -> pick this repository -> Apply.
services:
  - type: web
    name: agula-terminal
    runtime: python
    plan: free            # free: sleeps after 15 min idle, ~1 min to wake. Paid plans stay on.
    region: singapore     # closest Render region to Mongolia; oregon, ohio, virginia, frankfurt also exist
    buildCommand: pip install -r requirements.txt
    # One worker on purpose: every visitor shares one in-memory cache.
    startCommand: uvicorn agula:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NO_BROWSER
        value: "1"
      - key: AGULA_CACHE_DIR
        value: /tmp/agula-cache
      - key: AGULA_WARM
        value: "1"
      - key: AGULA_RATE_LIMIT
        value: "240"
      # Optional: a free FRED key makes the macro dashboard and release calendar more reliable.
      # Render asks for it when you create the Blueprint (leave blank to skip).
      - key: FRED_API_KEY
        sync: false
